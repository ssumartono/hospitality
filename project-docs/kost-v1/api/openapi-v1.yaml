openapi: 3.1.0
info:
  title: Kost Hospitality API
  version: 1.0.0
  description: Baseline kontrak implementasi. Belum ada server produksi. BR/acceptance
    dan otorisasi normatif pada docs; endpoint status bukan bukti implementasi. GET
    list memakai pagination; detail projections sesuai permission. Provider URL/credential
    tidak dipin dalam dokumen.
servers:
- url: /
  description: Same origin web/API; environment mengatur hostname.
security:
- SessionCookie: []
