      - Identity
      description: Rate limit, single-use token dan secure cookie sesuai BR-01.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Command/query selesai; tidak mengklaim delivery eksternal sebelum
            evidence.
