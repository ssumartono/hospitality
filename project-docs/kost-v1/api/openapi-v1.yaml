components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: kh_session
      description: HttpOnly Secure session, CSRF guard pada unsafe requests.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Server mengikat key pada actor/tenant/command/payload hash. Retry
        payload sama memberi hasil sama.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Validated anti-CSRF token; Origin/SameSite sesuai auth design.
  responses:
    DomainError:
      description: Validation/auth/permission/missing/quota/rate error; code stabil
        dan request ID, tanpa data privat.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '409: AVAILABILITY_CONFLICT, IDEMPOTENCY_MISMATCH, INVALID_STATE,
        BALANCE_CONFLICT, QUOTA_EXCEEDED atau VERSION_CONFLICT.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - requestId
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason: &id005
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
    EmptyRequest:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          writeOnly: true
      required:
      - name
      - email
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        mfaCode:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    ResetRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
      required:
      - token
      - newPassword
    OrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      required:
      - name
      - slug
    InvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - Owner
          - Manager
          - Finance
          - Operations
        propertyIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - email
      - role
      - propertyIds
    PropertyRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        city:
          type: string
        address:
          type: string
        timezone:
          type: string
          description: IANA timezone, pilot Asia/Jakarta
        floors:
          type: integer
          minimum: 1
        segment:
          type: string
          enum:
