            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/DomainError'
        '401':
          $ref: '#/components/responses/DomainError'
        '403':
          $ref: '#/components/responses/DomainError'
        '404':
          $ref: '#/components/responses/DomainError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/DomainError'
        '429':
          $ref: '#/components/responses/DomainError'
      security: []
      x-roles:
      - Owner
      x-acceptance-status: NOT RUN
      x-idempotent-command: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
